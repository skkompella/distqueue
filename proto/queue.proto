syntax = "proto3";

package distqueue.v1;

option go_package = "github.com/skkompella/distqueue/gen/queuepb";

import "google/protobuf/timestamp.proto";

service TaskQueue {
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse);
  rpc Dequeue(DequeueRequest) returns (DequeueResponse);
  rpc Ack(AckRequest)         returns (AckResponse);
  rpc Nack(NackRequest)       returns (NackResponse);
  rpc Stats(StatsRequest)     returns (StatsResponse);
  rpc ListDLQ(ListDLQRequest) returns (ListDLQResponse);
}

message Task {
  string id                            = 1;
  bytes payload                        = 2;
  int32 priority                       = 3;
  int32 retry_count                    = 4;
  google.protobuf.Timestamp created_at = 5;
}

message EnqueueRequest {
  Task task = 1;
}

message EnqueueResponse {
  string task_id = 1; // assigned by the broker if the request omitted one
}

message DequeueRequest {}

message DequeueResponse {
  Task task = 1;
}

message AckRequest {
  string task_id = 1;
}

message AckResponse {}

message NackRequest {
  string task_id = 1;
}

message NackResponse {}

message StatsRequest {}

message StatsResponse {
  int64 pending   = 1;
  int64 in_flight = 2;
  int64 dlq       = 3;
  int64 acked     = 4;
  // Target worker concurrency recommended by the adaptive control plane
  // (pushed via broker.conf + SIGHUP). 0 = no advice; workers keep their
  // current pool size. Single-node mode only for now.
  int32 advised_worker_count = 5;
}

message ListDLQRequest {}

message ListDLQResponse {
  repeated Task tasks = 1;
}
